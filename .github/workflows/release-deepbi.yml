name: Release Workflow - Publish Paimon to Maven Repo

on:
  workflow_dispatch:

env:
  JDK_VERSION: 11
  ARTIFACT_REPO: deep-bi/maven-repo
  MAVEN_OPTS: -Xmx4096m -Dmaven.wagon.httpconnectionManager.ttlSeconds=30 -Dmaven.wagon.http.retryHandler.requestSentEnabled=true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'deep-bi/paimon'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK ${{ env.JDK_VERSION }} and Maven
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JDK_VERSION }}
          cache: 'maven'

      - name: Extract version
        run: |
          VERSION=$(mvn -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          if [[ -z "$VERSION" || "$VERSION" == *-SNAPSHOT ]]; then
            echo "Refusing to release version '$VERSION'"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Checkout artifact repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARTIFACT_REPO }}
          token: ${{ secrets.MAVEN_PAT }}
          path: maven-repo

      - name: Check version is not already published
        run: |
          if [[ -d "maven-repo/org/apache/paimon/paimon-parent/$VERSION" ]]; then
            echo "Paimon $VERSION already exists in $ARTIFACT_REPO"
            exit 1
          fi

      # deploying straight into the checkout lets maven merge maven-metadata.xml
      # with the versions already published, instead of overwriting it
      - name: Build and deploy Paimon ${{ env.VERSION }}
        run: |
          mvn -B -ntp clean deploy \
            -DskipTests -Dgpg.skip -Drat.skip \
            -Ddocs-and-source -Dmaven.javadoc.skip=true \
            -DaltDeploymentRepository=deepbi::default::file://${GITHUB_WORKSPACE}/maven-repo

      # github rejects pushes containing files over 100MB
      - name: Check artifact sizes
        run: |
          OVERSIZED=$(find maven-repo/org/apache/paimon -path "*/$VERSION/*" -type f -size +95M)
          if [[ -n "$OVERSIZED" ]]; then
            echo "Artifacts too large for GitHub:"
            ls -lh $OVERSIZED
            exit 1
          fi

      - name: Publish Paimon ${{ env.VERSION }}
        working-directory: maven-repo
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add org/apache/paimon
          git commit -m "Added artifacts for paimon version $VERSION"
          git pull --rebase
          git push
